name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
  UNITY_VERSION: 6000.3.22f1

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: false
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-v2-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-v2-
            Library-Android-
            Library-

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 -d > multiformatris-release.keystore

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_VERSION: 6000.3.22f1
          TARGET_PLATFORM: Android
          BUILD_NAME: Multiformatris
          BUILD_PATH: build
          ANDROID_BUILD_SYSTEM: Gradle
          ANDROID_APP_BASE: com.multiformatris.game
          ANDROID_APP_NAME: Multiformatris
          ANDROID_VERSION_CODE: 1
          ANDROID_VERSION_NAME: 1.0.0
          ANDROID_MIN_SDK_VERSION: 25
          ANDROID_TARGET_SDK_VERSION: 34

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multiformatris-APK
          path: build/**/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/**/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android-aab:
    name: Build Android AAB (Play Store)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: false
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-AAB-v2-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-AAB-v2-
            Library-AAB-
            Library-

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 -d > multiformatris-release.keystore

      - name: Build Android AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_VERSION: 6000.3.22f1
          TARGET_PLATFORM: Android
          BUILD_NAME: Multiformatris
          BUILD_PATH: build
          ANDROID_BUILD_SYSTEM: Gradle
          ANDROID_APP_BASE: com.multiformatris.game
          ANDROID_APP_NAME: Multiformatris
          ANDROID_VERSION_CODE: 1
          ANDROID_VERSION_NAME: 1.0.0
          ANDROID_MIN_SDK_VERSION: 25
          ANDROID_TARGET_SDK_VERSION: 34
          ANDROID_EXPORT_TYPE: app-bundle

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multiformatris-AAB
          path: build/**/*.aab
          retention-days: 30
